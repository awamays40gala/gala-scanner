<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
Pastor A. W. Anthony Mays 40th Pastoral Anniversary Gala Check In
</title>

<script
  src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f3f3f3;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 0;
}

h2 {
  text-align: center;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 18px;
  margin-bottom: 12px;
}

button {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  margin-top: 8px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.secondary {
  background: #555;
}

.success {
  background: #d4edda;
  color: #155724;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

.warning {
  background: #fff3cd;
  color: #856404;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

.error {
  color: #b00020;
  text-align: center;
  font-weight: bold;
  margin-top: 15px;
}

.center {
  text-align: center;
}

.ticket-id {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
  word-break: break-all;
  margin: 20px 0;
}

.ticket-type {
  font-size: 30px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
}

.check-time {
  text-align: center;
  color: #666;
  margin-top: 12px;
}

#scanner {
  width: 100%;
  margin-top: 15px;
}

#scannerArea {
  display: none;
}

#ticketCard {
  display: none;
}

#loginCard {
  display: block;
}

#cameraStatus {
  text-align: center;
  font-weight: bold;
  margin: 10px 0;
}

#cameraHelp {
  display: none;
  background: #fff3cd;
  color: #856404;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  text-align: center;
}

hr {
  border: 0;
  border-top: 1px solid #ddd;
  margin: 25px 0;
}

</style>

</head>

<body>

<div class="container">


<!-- ==================================================
     LOGIN
================================================== -->

<div
  id="loginCard"
  class="card">

<h1>
Pastor Mays Gala
</h1>

<p class="center">
Registration Check In
</p>

<label>
Staff PIN
</label>

<input
  id="pin"
  type="password"
  inputmode="numeric"
  placeholder="Enter staff PIN">

<button
  onclick="unlock()">

UNLOCK CHECK IN

</button>

<div
  id="loginError"
  class="error">
</div>

</div>


<!-- ==================================================
     SCANNER AREA
================================================== -->

<div
  id="scannerArea">


<div class="card">

<h1>
Scan Ticket
</h1>

<div
  id="cameraStatus">

Camera starting...

</div>

<div
  id="scanner">
</div>

<div
  id="cameraHelp">

Camera access is required for QR scanning.
<br><br>
If your browser asks for camera permission,
choose <strong>Allow</strong>.

</div>

<p class="center">
Point the camera at the guest's QR code.
</p>

<hr>

<label>
Or enter Ticket ID
</label>

<input
  id="manualTicket"
  placeholder="PM40-XXXXXXXX"
  autocomplete="off">

<button
  onclick="manualLookup()">

LOOK UP TICKET

</button>

<div
  id="scannerError"
  class="error">
</div>

</div>


<!-- ==================================================
     TICKET INFORMATION
================================================== -->

<div
  id="ticketCard"
  class="card">

<h2>
Ticket Information
</h2>

<div
  id="ticketID"
  class="ticket-id">
</div>

<div
  id="ticketType"
  class="ticket-type">
</div>

<div
  id="ticketStatus">
</div>

<div
  id="checkTime"
  class="check-time">
</div>

<button
  id="checkInButton"
  onclick="checkIn()">

CHECK IN TICKET

</button>

<div
  id="checkInMessage">
</div>

<button
  class="secondary"
  onclick="scanAnother()">

SCAN ANOTHER TICKET

</button>

</div>

</div>


<script>


/******************************************************
 * SETTINGS
 ******************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbxMIXvDLYnEp3Sdnid-_TIU8eW7ZAnnUCKj6IZ-65vW_8otla2BwQPDGSFf8BU9E6s/exec";


const STAFF_PIN =
"1986";


const TICKET_PREFIX =
"PM40-";


let staffPIN =
"";


let currentTicketID =
"";


let html5QrCode =
null;


let scannerRunning =
false;


let scanLocked =
false;


/******************************************************
 * UNLOCK
 ******************************************************/

function unlock() {

  const pin =
    document
      .getElementById("pin")
      .value
      .trim();


  if (
    pin !== STAFF_PIN
  ) {

    document
      .getElementById("loginError")
      .innerText =
      "Invalid staff PIN.";

    return;

  }


  staffPIN =
    pin;


  document
    .getElementById("loginError")
    .innerText =
    "";


  document
    .getElementById("loginCard")
    .style.display =
    "none";


  document
    .getElementById("scannerArea")
    .style.display =
    "block";


  startScanner();

}


/******************************************************
 * START SCANNER
 ******************************************************/

async function startScanner() {

  const status =
    document
      .getElementById("cameraStatus");


  const errorBox =
    document
      .getElementById("scannerError");


  status.innerText =
    "Starting camera...";


  errorBox.innerText =
    "";


  document
    .getElementById("cameraHelp")
    .style.display =
    "none";


  scanLocked =
    false;


  /*
   * Stop an existing scanner first.
   */

  if (
    html5QrCode &&
    scannerRunning
  ) {

    try {

      await html5QrCode.stop();

    } catch (error) {

      console.log(
        "Previous scanner stop:",
        error
      );

    }

  }


  scannerRunning =
    false;


  const scannerElement =
    document
      .getElementById("scanner");


  scannerElement.innerHTML =
    "";


  /*
   * Make sure the QR library loaded.
   */

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    status.innerText =
      "QR scanner library failed to load.";

    errorBox.innerText =
      "Please refresh the page and try again.";

    return;

  }


  /*
   * Create scanner.
   */

  html5QrCode =
    new Html5Qrcode(
      "scanner"
    );


  try {

    /*
     * First try the rear camera
     * using the environment facing mode.
     */

    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      {

        fps:
          10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio:
          1.0

      },

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal scanning errors
         * are ignored.
         */

      }

    );


    scannerRunning =
      true;


    status.innerText =
      "Camera ready";


    return;

  } catch (environmentError) {

    console.log(
      "Environment camera failed:",
      environmentError
    );

  }


  /*
   * If the rear camera attempt failed,
   * ask the browser for available cameras.
   */

  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera was found."
      );

    }


    let cameraID =
      cameras[0].id;


    /*
     * Prefer a rear camera if available.
     */

    const rearCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label ||
              ""
            )
            .toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment")
          );

        }
      );


    if (
      rearCamera
    ) {

      cameraID =
        rearCamera.id;

    }


    await html5QrCode.start(

      cameraID,

      {

        fps:
          10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio:
          1.0

      },

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Normal QR scanning errors
         * are ignored.
         */

      }

    );


    scannerRunning =
      true;


    status.innerText =
      "Camera ready";


  } catch (cameraError) {

    scannerRunning =
      false;


    status.innerText =
      "Camera could not start.";


    errorBox.innerText =
      "Camera access failed: " +
      cameraError.message;


    document
      .getElementById("cameraHelp")
      .style.display =
      "block";


    console.error(
      "CAMERA ERROR:",
      cameraError
    );

  }

}


/******************************************************
 * HANDLE QR SCAN
 ******************************************************/

function handleScan(
  text
) {

  if (
    !text ||
    scanLocked
  ) {

    return;

  }


  scanLocked =
    true;


  const originalText =
    String(
      text
    )
    .trim();


  const upperText =
    originalText
    .toUpperCase();


  console.log(
    "QR CONTENT:",
    originalText
  );


  let ticketID =
    "";


  /*
   * Look for PM40 ticket ID.
   */

  const match =
    upperText.match(
      /PM40-[A-Z0-9]{8}/
    );


  if (
    match
  ) {

    ticketID =
      match[0];

  }


  /*
   * If QR contains a URL,
   * look for the ticket parameter.
   */

  if (
    !ticketID
  ) {

    try {

      const url =
        new URL(
          originalText
        );


      const urlTicket =
        url.searchParams.get(
          "ticket"
        );


      if (
        urlTicket
      ) {

        ticketID =
          urlTicket
          .trim()
          .toUpperCase();

      }

    } catch (error) {

      /*
       * QR content was not a URL.
       */

    }

  }


  /*
   * Validate ticket ID.
   */

  if (
    !ticketID.startsWith(
      TICKET_PREFIX
    )
  ) {

    scanLocked =
      false;


    document
      .getElementById("scannerError")
      .innerText =
      "QR detected, but no valid PM40 Ticket ID was found.";

    return;

  }


  console.log(
    "TICKET ID:",
    ticketID
  );


  stopScanner();


  lookupTicket(
    ticketID
  );

}


/******************************************************
 * MANUAL LOOKUP
 ******************************************************/

function manualLookup() {

  const ticketID =
    document
      .getElementById("manualTicket")
      .value
      .trim()
      .toUpperCase();


  if (
    !ticketID
  ) {

    document
      .getElementById("scannerError")
      .innerText =
      "Enter a Ticket ID.";

    return;

  }


  if (
    !ticketID.startsWith(
      TICKET_PREFIX
    )
  ) {

    document
      .getElementById("scannerError")
      .innerText =
      "Please enter a valid PM40 Ticket ID.";

    return;

  }


  lookupTicket(
    ticketID
  );

}


/******************************************************
 * LOOKUP TICKET
 ******************************************************/

async function lookupTicket(
  ticketID
) {

  currentTicketID =
    ticketID;


  document
    .getElementById("scannerError")
    .innerText =
    "Looking up ticket...";


  const url =
    API_URL +
    "?action=lookup" +
    "&ticket=" +
    encodeURIComponent(
      ticketID
    ) +
    "&pin=" +
    encodeURIComponent(
      staffPIN
    );


  try {

    const response =
      await fetch(
        url
      );


    const result =
      await response.json();


    console.log(
      "LOOKUP RESULT:",
      result
    );


    if (
      !result ||
      !result.success
    ) {

      scanLocked =
        false;


      document
        .getElementById("scannerError")
        .innerText =
        result &&
        result.message
          ? result.message
          : "Ticket not found.";

      return;

    }


    displayTicket(
      result
    );


  } catch (error) {

    console.error(
      "LOOKUP ERROR:",
      error
    );


    scanLocked =
      false;


    document
      .getElementById("scannerError")
      .innerText =
      "Unable to connect to the gala system.";

  }

}


/******************************************************
 * DISPLAY TICKET
 ******************************************************/

function displayTicket(
  ticket
) {

  document
    .getElementById("scannerError")
    .innerText =
    "";


  document
    .getElementById("ticketCard")
    .style.display =
    "block";


  document
    .getElementById("ticketID")
    .innerText =
    ticket.ticketID;


  const ticketType =
    document
      .getElementById("ticketType");


  const vip =
    String(
      ticket.vip || ""
    )
    .trim()
    .toLowerCase();


  if (
    vip ===
    "yes"
  ) {

    ticketType.innerText =
      "VIP TICKET";

  } else {

    ticketType.innerText =
      "GENERAL TICKET";

  }


  const status =
    document
      .getElementById("ticketStatus");


  const checkTime =
    document
      .getElementById("checkTime");


  const button =
    document
      .getElementById("checkInButton");


  const checkedIn =
    String(
      ticket.checkedIn || ""
    )
    .trim()
    .toLowerCase();


  if (
    checkedIn ===
    "yes"
  ) {

    status.className =
      "success";


    status.innerText =
      "ALREADY CHECKED IN";


    checkTime.innerText =
      ticket.checkInTime
        ? "Checked in: " +
          ticket.checkInTime
        : "";


    button.style.display =
      "none";


  } else {

    status.className =
      "warning";


    status.innerText =
      "NOT CHECKED IN";


    checkTime.innerText =
      "";


    button.style.display =
      "block";


    button.disabled =
      false;


    button.innerText =
      "CHECK IN TICKET";

  }

}


/******************************************************
 * CHECK IN
 ******************************************************/

async function checkIn() {

  const button =
    document
      .getElementById("checkInButton");


  const message =
    document
      .getElementById("checkInMessage");


  button.disabled =
    true;


  button.innerText =
    "CHECKING IN...";


  message.innerText =
    "";


  const url =
    API_URL +
    "?action=checkin" +
    "&ticket=" +
    encodeURIComponent(
      currentTicketID
    ) +
    "&pin=" +
    encodeURIComponent(
      staffPIN
    );


  try {

    const response =
      await fetch(
        url
      );


    const result =
      await response.json();


    console.log(
      "CHECK IN RESULT:",
      result
    );


    if (
      result &&
      result.success
    ) {

      document
        .getElementById("ticketStatus")
        .className =
        "success";


      document
        .getElementById("ticketStatus")
        .innerText =
        "CHECKED IN";


      document
        .getElementById("checkTime")
        .innerText =
        result.checkInTime
          ? "Checked in: " +
            result.checkInTime
          : "";


      button.style.display =
        "none";


      message.className =
        "success";


      message.innerText =
        "✓ Ticket checked in successfully.";

      return;

    }


    if (
      result &&
      result.alreadyCheckedIn
    ) {

      document
        .getElementById("ticketStatus")
        .className =
        "success";


      document
        .getElementById("ticketStatus")
        .innerText =
        "ALREADY CHECKED IN";


      document
        .getElementById("checkTime")
        .innerText =
        result.checkInTime
          ? "Checked in: " +
            result.checkInTime
          : "";


      button.style.display =
        "none";


      message.className =
        "error";


      message.innerText =
        "This ticket has already been checked in.";

      return;

    }


    button.disabled =
      false;


    button.innerText =
      "CHECK IN TICKET";


    message.className =
      "error";


    message.innerText =
      result &&
      result.message
        ? result.message
        : "Unable to check in ticket.";

  } catch (error) {

    console.error(
      "CHECK IN ERROR:",
      error
    );


    button.disabled =
      false;


    button.innerText =
      "CHECK IN TICKET";


    message.className =
      "error";


    message.innerText =
      "Unable to connect to the gala system.";

  }

}


/******************************************************
 * STOP SCANNER
 ******************************************************/

async function stopScanner() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  } catch (error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  scannerRunning =
    false;

}


/******************************************************
 * SCAN ANOTHER TICKET
 ******************************************************/

async function scanAnother() {

  await stopScanner();


  document
    .getElementById("ticketCard")
    .style.display =
    "none";


  document
    .getElementById("manualTicket")
    .value =
    "";


  document
    .getElementById("checkInMessage")
    .innerText =
    "";


  document
    .getElementById("ticketStatus")
    .innerText =
    "";


  document
    .getElementById("checkTime")
    .innerText =
    "";


  document
    .getElementById("scannerError")
    .innerText =
    "";


  scanLocked =
    false;


  startScanner();

}


/******************************************************
 * ENTER KEY FOR MANUAL LOOKUP
 ******************************************************/

document
  .getElementById("manualTicket")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        manualLookup();

      }

    }
  );


</script>

</body>

</html>
